# Paste into Portainer → Stacks → Web editor
# Open http://<server-ip>:8044 after deploy
#
# All persistent data lives in the factory_data volume (config, workspaces, postgres, redis).

services:
  factory:
    image: ghcr.io/leemotheyer/turtslopfactory:latest
    restart: unless-stopped
    environment:
      FACTORY_DATA: /data
      FACTORY_CONFIG_DIR: /data/config
      WORKSPACE_ROOT: /data/workspaces
      DATABASE_URL: postgresql+asyncpg://factory:factory@127.0.0.1:5432/factory
      REDIS_URL: redis://127.0.0.1:6379/0
      WORKER_ENABLED: "true"
      CORS_ALLOW_ALL: "true"
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - factory_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8044:80"
      - "9010-9039:9010-9039"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

volumes:
  factory_data:
