name: Build and publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/turtslopfactory
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=factory
          cache-to: type=gha,mode=max,scope=factory

      - name: Make GHCR package public
        continue-on-error: true
        run: |
          if gh api --method PATCH /user/packages/container/turtslopfactory -f visibility=public; then
            echo "GHCR package turtslopfactory is now public"
          else
            echo "::warning::Could not auto-publish GHCR package. In GitHub: Packages → turtslopfactory → Package settings → Change visibility → Public"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
