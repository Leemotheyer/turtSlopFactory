# Portainer stack — build from GitHub (no GHCR pull required)
# Stacks → Add stack → Repository: https://github.com/Leemotheyer/turtSlopFactory
# Compose path: portainer-stack.build.yml
#
# Or paste this file into the Web editor if your Portainer supports compose build.

services:
  factory:
    build:
      context: https://github.com/Leemotheyer/turtSlopFactory.git#main
      dockerfile: Dockerfile
    image: turtslopfactory:local
    restart: unless-stopped
    environment:
      FACTORY_DATA: /data
      FACTORY_CONFIG_DIR: /data/config
      WORKSPACE_ROOT: /data/workspaces
      DATABASE_URL: postgresql+asyncpg://factory:factory@127.0.0.1:5432/factory
      REDIS_URL: redis://127.0.0.1:6379/0
      WORKER_ENABLED: "true"
      CORS_ALLOW_ALL: "true"
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - factory_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8044:80"
      - "9010-9039:9010-9039"
    healthcheck:
      test: ["CMD", "/deploy/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s

volumes:
  factory_data:
