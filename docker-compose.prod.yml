# turtSlopFactory — pre-built images from GHCR (recommended for Portainer)
# Deploy: docker compose -f docker-compose.prod.yml up -d
# No .env required. Open http://<host>:3000 and complete quick setup in the UI.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factory

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factory

  orchestrator:
    image: ghcr.io/leemotheyer/turtslopfactory-orchestrator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /data/workspaces
      WORKER_ENABLED: "false"
      CORS_ALLOW_ALL: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspace_data:/data/workspaces
    networks:
      - factory

  worker:
    image: ghcr.io/leemotheyer/turtslopfactory-orchestrator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["python", "worker_main.py"]
    ports:
      - "8081-8099:8081-8099"
    environment:
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /data/workspaces
      CORS_ALLOW_ALL: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    volumes:
      - workspace_data:/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - factory

  dashboard:
    image: ghcr.io/leemotheyer/turtslopfactory-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
    networks:
      - factory

volumes:
  pgdata:
  workspace_data:

networks:
  factory:
    driver: bridge
