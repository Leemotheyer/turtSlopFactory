# turtSlopFactory — recommended deploy (zero config)
#   docker compose up -d
#   open http://localhost
#
# One URL (port 80): dashboard + API. Live previews on ports 8081–8099.
# Optional dev build: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factory

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factory

  factory:
    image: ghcr.io/leemotheyer/turtslopfactory-orchestrator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /data/workspaces
      WORKER_ENABLED: "true"
      CORS_ALLOW_ALL: "true"
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspace_data:/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081-8099:8081-8099"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - factory

  dashboard:
    image: ghcr.io/leemotheyer/turtslopfactory-dashboard:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      factory:
        condition: service_healthy
    networks:
      - factory

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - factory
      - dashboard
    networks:
      - factory

volumes:
  pgdata:
  workspace_data:

networks:
  factory:
    driver: bridge
