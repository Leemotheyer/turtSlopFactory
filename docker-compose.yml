# turtSlopFactory — single-container deploy
#   docker compose up -d
#   open http://localhost:8044
#
# Set FACTORY_DATA to choose where all persistent data lives (default: ./data).
# FACTORY_DATA_DIR is supported as a legacy alias.
# Only the Docker socket is mounted separately (for pipeline builds).

services:
  factory:
    image: ghcr.io/leemotheyer/turtslopfactory:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: ${FACTORY_DATA:-${FACTORY_DATA_DIR:-./data}}/config/local.env
        required: false
    environment:
      FACTORY_DATA: /data
      FACTORY_CONFIG_DIR: /data/config
      WORKSPACE_ROOT: /data/workspaces
      DATABASE_URL: postgresql+asyncpg://factory:factory@127.0.0.1:5432/factory
      REDIS_URL: redis://127.0.0.1:6379/0
      WORKER_ENABLED: "true"
      CORS_ALLOW_ALL: "true"
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - ${FACTORY_DATA:-${FACTORY_DATA_DIR:-./data}}:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${HTTP_PORT:-8044}:80"
      - "9010-9039:9010-9039"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
