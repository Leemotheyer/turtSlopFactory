# turtSlopFactory — zero-config stack (build from source)
# Deploy: docker compose up -d --build
# Configure after launch in the dashboard (hostname, API key, Cursor).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factory

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factory

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /data/workspaces
      WORKER_ENABLED: "false"
      CORS_ALLOW_ALL: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - workspace_data:/data/workspaces
    networks:
      - factory

  worker:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker_main.py"]
    ports:
      - "8081-8099:8081-8099"
    environment:
      DATABASE_URL: postgresql+asyncpg://factory:factory@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /data/workspaces
      CORS_ALLOW_ALL: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_started
    volumes:
      - workspace_data:/data/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - factory

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
    networks:
      - factory

volumes:
  pgdata:
  workspace_data:

networks:
  factory:
    driver: bridge
